name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.47.9 (stable)
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Verify pinned toolchain versions
        run: |
          flutter --version
          dart --version
          java --version
          python3 - <<'PY_VERSIONS'
          import json
          import subprocess

          version = json.loads(
              subprocess.check_output(
                  ['flutter', '--version', '--machine'],
                  text=True,
              )
          )
          expected = {'frameworkVersion': '3.47.9', 'dartSdkVersion': '3.13.7'}
          for key, value in expected.items():
              actual = version.get(key)
              if actual != value:
                  raise SystemExit(f'Expected {key} {value}, found {actual}')
          print('Verified Flutter 3.47.9 and Dart 3.13.7.')
          PY_VERSIONS

      - name: Generate Android platform project
        run: flutter create --project-name=zeeshan_daily_life_style --org=com.example --platforms=android .

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/cmdline-tools" ]]; then
            echo 'Android SDK or command-line tools were not found on the runner.' >&2
            exit 1
          fi

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find -L "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo 'Could not find an executable Android sdkmanager.' >&2
            exit 1
          fi

          # Flutter 3.47.9's Android template uses NDK 28.2.13676358.
          # The hosted Ubuntu 24.04 image does not currently preinstall that NDK.
          python3 - "$SDKMANAGER" "$SDK_ROOT" <<'PY_LICENSES'
          import subprocess
          import sys

          subprocess.run(
              [sys.argv[1], f'--sdk_root={sys.argv[2]}', '--licenses'],
              input='y\n' * 100,
              text=True,
              stdout=subprocess.DEVNULL,
              check=True,
          )
          PY_LICENSES

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358'

          test -d "$SDK_ROOT/platforms/android-36"
          test -d "$SDK_ROOT/build-tools/36.0.0"
          test -d "$SDK_ROOT/ndk/28.2.13676358"

      - name: Set and verify Android app display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text(encoding='utf-8')
          updated, replacements = re.subn(
              r'android:label="[^"]*"',
              'android:label="Zeeshan Daily Life Style"',
              source,
              count=1,
          )
          if replacements != 1:
              raise SystemExit('Could not find android:label in the generated manifest.')
          manifest.write_text(updated, encoding='utf-8')
          print('Updated:', manifest)
          PY

      # Flutter 3.47.9 uses the supported Android toolchain defaults:
      # Java 17, AGP 9.1.0, Gradle 9.3.1, compile/target SDK 36, min SDK 24.
      # Do not override compileSdk with a Gradle init script.
      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Generate Android launcher icon
        run: dart run flutter_launcher_icons

      - name: Format Dart source
        run: dart format lib test

      - name: Analyze Dart and Flutter code
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: zeeshan-daily-life-style-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
