name: zeeshan_daily_life_style
description: Offline personal life tracker for daily logs, health, mind, work and ideas.
publish_to: 'none'
version: 1.1.3+7

environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: '>=3.47.9 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  cross_file: ^0.3.5+5
  file_picker: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  min_sdk_android: 24
